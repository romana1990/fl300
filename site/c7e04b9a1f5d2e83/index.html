}
function put(ch) {
  const k = cur.join(); letters[k] = ch; at[k].firstChild.textContent = ch; document.getElementById('out').textContent = '';
  try { localStorage.setItem('fl300.grid', JSON.stringify(letters)); } catch {}
}
function step(delta) {
  const cl = entry(cur[0], cur[1], dir); if (!cl) return; const cs = cellsOf(cl);
  const i = cs.findIndex(([r, c]) => r === cur[0] && c === cur[1]) + delta;
  if (i >= 0 && i < cs.length) { cur = cs[i]; paint(); }
}
kbd.addEventListener('input', () => {
  const v = kbd.value.toUpperCase().replace(/[^A-ZČĆŠŽĐ]/g, ''); kbd.value = '';
  if (!cur || !v) return; put(v.slice(-1)); step(1);
});
kbd.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'Backspace') { e.preventDefault(); if (letters[cur.join()]) put(''); else { step(-1); put(''); } }
  const mv = { ArrowRight: [0, 1, 'A'], ArrowLeft: [0, -1, 'A'], ArrowDown: [1, 0, 'D'], ArrowUp: [-1, 0, 'D'] }[e.key];
  if (mv) { e.preventDefault(); const r = cur[0] + mv[0], c = cur[1] + mv[1]; dir = mv[2]; if (letters[r + ',' + c] !== undefined) select(r, c, true); else paint(); }
});
document.getElementById('zoom').onclick = e => { const w = document.getElementById('wrap'), z = w.classList.toggle('zoomed'); e.target.textContent = z ? 'Umanji' : 'Uvećaj'; if (!z) w.scrollLeft = 0; };
document.getElementById('chk').onclick = async () => {
  const out = document.getElementById('out'), all = P.cells.filter(c => c.t === 'L').map(c => letters[c.r + ',' + c.c]);
  if (all.some(v => !v)) { out.textContent = 'Nisu popunjena sva polja.'; return; }
  out.textContent = '…';
  try { out.textContent = await FL.sha16('fl300:grid:' + FL.norm(all.join(''))) === P.check ? 'Tačno.' : 'Netačno.'; }
  catch { out.textContent = 'Provera ne radi na ovoj adresi (potreban je https).'; } // crypto.subtle needs a secure origin
};
