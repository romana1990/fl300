<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FL300</title>
<link rel="stylesheet" href="/css/fl300.css">
<style>
  :root { --ink: #fff; --paper: #000; }
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
    padding: 0 7vw; box-sizing: border-box;
  }
  main { max-width: 34rem; }
  p { font-size: clamp(1.4rem, 5.4vw, 2.2rem); line-height: 1.22; margin: 0 0 2.2rem; letter-spacing: -.005em; }
  .faint { color: #141414; font-size: .7rem; letter-spacing: .6em; margin-top: 4rem; }
  form.answer { margin: 0 0 1.4rem; max-width: none; }
  form.answer label { font-size: .7rem; letter-spacing: .3em; color: #8a8a8a; }
  form.answer .row { border-color: #fff; }
  form.answer button { font-weight: 700; }
  #cs-form .row { border-color: #555; }
  form.answer input::placeholder { color: #444; }
</style>
</head>
<body data-stage="1">
<main>
  <p>Hello.</p>
  <form class="answer callsign" id="cs-form" autocomplete="off">
    <label for="cs">Callsign</label>
    <div class="row"><input id="cs" name="cs" maxlength="24" placeholder="Your team" autocapitalize="characters" spellcheck="false"><button type="submit" aria-label="Save callsign">OK</button></div>
    <output class="verdict" aria-live="polite"></output>
  </form>
  <form class="answer" autocomplete="off">
    <label for="code">Code</label>
    <div class="row"><input id="code" name="code" inputmode="numeric" autocapitalize="characters" spellcheck="false"><button type="submit">Enter</button></div>
    <output class="verdict" aria-live="polite"></output>
  </form>
  <div class="faint" aria-hidden="true">F L 3 0 0</div>
</main>
<script src="/js/common.js"></script>
<script>
  const cf = document.getElementById('cs-form'), cs = document.getElementById('cs');
  cs.value = FL.callsign();
  const save = () => { FL.callsign(cs.value.trim().slice(0, 24)); cf.querySelector('.verdict').textContent = cs.value.trim() ? 'Noted, ' + cs.value.trim().toUpperCase() + '.' : ''; };
  cf.addEventListener('submit', e => { e.preventDefault(); save(); document.getElementById('code').focus(); });
  cs.addEventListener('change', save);
</script>
</body>
</html>
